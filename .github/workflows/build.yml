name: Build & Deploy

# 觸發方式（2026-10-23 起）：僅手動 workflow_dispatch。
#   ⚠️ schedule: 已永久移除——GitHub scheduler 可靠度不足，實際等同沒用：
#      2026-10-23 實測近 2 天 schedule 僅觸發 10 次（應為 24），間隔 185–424 分
#      （應為 120 分），每次 run 2.5–3.4 分鐘；同期間本地 cron 10/10 準時、历時 33–58 秒。
#      GitHub 側亦有排程延遲 5–7 小時／整期漏跑的公開回報（community discussion #201472）。
#      自動 build＋部署的唯一通道＝本地 cron（每小時，見 build/cron.txt、LOCAL_CRON.md）。
#      改排程／改 Worker 觸發的替代方案評估（未實作）→ design/cf-cron.md。
#
# 歷史：2026/8/29 曾因 CWA 回傳 MaxWindSpeed=None 崩潰而停用排程（TypeError，已修復），
#       2026/9/26 恢復、2026-10-23 因上述排程可靠度問題彻底停用。
#
# ⚠️ GitHub Actions 的 YAML parser 已把 on 當關鍵字，不需要加引號。
on:
  workflow_dispatch: {}

# 推 gh-pages 需要寫入 contents 的權限
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build（抓 CWA + 產出 public/）
        # build/build.sh 自動建 venv、裝 markdown；CWA 走 curl 子進程（避開 Python 3.14 SSL 問題）
        # ⚠️ build.sh 內建 CWA 檢查：失敗時 exit 1，不繼續部署
        run: bash build/build.sh
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}

      - name: 確認 Cloudflare 憑證就位
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID Secret"
            exit 1
          fi
          echo "Cloudflare 憑證已就位"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 部署到 Cloudflare Pages（主要通道）
        # 與本機 deploy.sh 相同的 wrangler 指令，憑證取自 Actions Secret
        run: npx -y wrangler@latest pages deploy public --project-name weather
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 部署到 GitHub Pages（orphan gh-pages，私有 mirror）
        # 改用 git orphan push 取代 peaceiris，避免觸發 GitHub Pages 內建 workflow 造成迴圈
        run: |
          TMP="$(mktemp -d)"
          rsync -a --delete --exclude '.DS_Store' ./public/ "$TMP/"
          git -C "$TMP" init -q -b gh-pages
          git -C "$TMP" config user.name "github-actions[bot]"
          git -C "$TMP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TMP" add -A
          git -C "$TMP" commit -q -m "site update: $(date +%Y/%m/%d %H:%M UTC)"
          git -C "$TMP" push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          rm -rf "$TMP"
